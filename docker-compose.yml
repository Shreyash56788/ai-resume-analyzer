services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-resume-backend

    env_file:
      - .env

    ports:
      - "8001:8001"

    volumes:
      - ./storage:/app/storage
      - ./uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: ai-resume-frontend

    ports:
      - "8501:8501"

    depends_on:
      backend:
        condition: service_healthy
